# /etc/nginx/sites-available/ravenyz
# Danach: sudo ln -s /etc/nginx/sites-available/ravenyz /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#         sudo certbot --nginx -d ravenyz.com -d www.ravenyz.com
server {
    listen 80;
    listen [::]:80;
    server_name ravenyz.com www.ravenyz.com;

    root /var/www/ravenyz/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Konfigurationsdateien nie ausliefern
    location ~ /\.(?!well-known) { deny all; }
}
